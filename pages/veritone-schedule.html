        var widest = blocks.reduce(function (best, block, index) {
            return block.widthPct > blocks[best].widthPct ? index : best;
        }, 0);

        blocks.forEach(function (block, index) {
            var $block = $('<div class="noc-shift-block" tabindex="0">')
                .css({ left: block.leftPct + '%', width: block.widthPct + '%', background: shift.color })
                .attr('aria-label', shiftAriaLabel(shift))
                .append($('<span class="noc-shift-block-label">'));

            if (index === widest) { $block.data('labels', labels); }

            $block.appendTo($row);
        });
    }

    var SHIFT_BLOCK_PADDING = 12;   // .noc-shift-block horizontal padding, both sides

    // Percentage thresholds can't work for this: the same 37.5%-wide block is
    // ~266px at the board's min-width and ~450px on a wide monitor, while a
    // caption is a fixed pixel length. So captions are chosen by measurement —
    // longest candidate that fits — once the blocks are in the document and have
    // a real width. Must run after the boards are attached, and again on resize.
    function fitShiftBlockLabels() {
        $('.noc-shift-block').each(function () {
            var labels = $(this).data('labels') || [];
            var label = this.querySelector('.noc-shift-block-label');
            var available = this.clientWidth - SHIFT_BLOCK_PADDING;

            // A block inside a hidden lane measures zero. Leaving its caption
            // alone matters: clearing it here would blank the text and nothing
            // would put it back when the search is cleared.
            if (available <= 0) { return; }

            for (var i = 0; i < labels.length; i++) {
                label.textContent = labels[i];
                if (label.scrollWidth <= available) { return; }
            }
            label.textContent = '';
        });
    }

    // The shift as it falls on the window's own day — the reference occurrence
    // used for every "what hours is this shift" readout.
    function canonicalShiftInstants(shift) {
        return getShiftInstantsOn(shift.id, windowStart.clone().tz(getScheduleTimezone()).format('YYYY-MM-DD'));
    }

    // 'z' resolves the live abbreviation at that instant, so it follows DST on
    // its own — IST, UTC, MDT/MST, EDT/EST — rather than being pinned in data.
    function formatRangeWithZone(instants, tz) {
        return formatRange(instants, tz) + ' ' + instants.start.clone().tz(tz).format('z');
    }

    function shiftAriaLabel(shift) {
        var canonical = canonicalShiftInstants(shift);
        return shift.label
            + ' • ' + formatRangeWithZone(canonical, getScheduleTimezone())
            + ' • ' + formatRangeWithZone(canonical, selectedTimezone);
    }

    /* ==================================================================
       Timezone comparison section: one hour-label strip per timezone in
       the list, so it's easy to read what time it is everywhere at a
       glance. Since shifts are defined in team-base (India) time, the
       shift lanes are shown only above the India row, not repeated for
       every timezone. Each row carries its own "now" chip.
       ================================================================== */
    function renderTimezoneCompare() {
        resetWindow();
        var $tbody = $('#noc-tzcmp-tbody').empty();
        var laneShifts = getShiftsInUse();
        var teamTimezone = getScheduleTimezone();

        TIMEZONES.forEach(function (tzOption) {
            var tz = tzOption.value;
            var isTeamBase = tz === teamTimezone;
            var $tr = $('<tr class="noc-tzcmp-row">');

            var $label = $('<td class="noc-tzcmp-label">');
            $('<div class="noc-tzcmp-name">').text(tzOption.pill).appendTo($label);
            if (isTeamBase) {
                $('<div class="noc-tzcmp-tag">').text('Team base').appendTo($label);
            }
            $tr.append($label);

            var $timelineTd = $('<td class="noc-td-timeline">');
            var $bar = $('<div class="noc-bar-cell">');

            if (isTeamBase) {
                laneShifts.forEach(function (shift) {
                    var $shiftRow = $('<div class="noc-bar-row noc-bar-row--shift">').appendTo($bar);
                    // Named here, not timed — up in the chart there is no label
                    // column to say which lane is which.
                    renderShiftBlocksInto($shiftRow, shift, [shift.label]);
                });
            }

            var $labelsRow = $('<div class="noc-bar-row noc-bar-row--labels">')
                .css('background', buildClockGradientCss(tz))
                .appendTo($bar);
            renderHourMarksInto($labelsRow, buildHourMarks(tz));

            $('<div class="noc-now-chip">')
                .attr('data-tz', tz)
                .append(
                    $('<span class="noc-now-chip-time">'),
                    $('<span class="noc-now-chip-zone">')
                )
                .appendTo($labelsRow);

            $timelineTd.append($bar);
            $tr.append($timelineTd);
            $tbody.append($tr);
        });

        // Rebuilding the tbody throws away the chips mid-flight. Without this the
        // fresh ones sit empty at their default position until the next 1s tick —
        // which is the blank stub that flashes in the middle every minute.
        tickLiveClocks();
        fitShiftBlockLabels();
    }

    var STATUS_META = {
        active: { label: 'Working now', cls: 'is-active' },
        upcoming: { label: 'Starting soon', cls: 'is-upcoming' },
        off: { label: 'Off shift', cls: '' },
        weekend: { label: 'On weekend', cls: 'is-weekend' },
        leave: { label: 'On leave', cls: 'is-leave' },
        holiday: { label: 'On holiday', cls: 'is-holiday' },
        'not-scheduled': { label: 'Not scheduled', cls: 'is-not-scheduled' },
    };

    function initials(name) {
        return name.split(/\s+/).map(function (part) { return part.charAt(0); }).join('').substring(0, 2).toUpperCase();
    }

    /* ==================================================================
       Presence : who is on right now, and who is on next.

       Both halves group by shift rather than listing loose names. Two shifts
       overlap for part of the day, so "who is on" is only meaningful alongside
       which shift; and people come online in shift-sized batches, so the
       countdown belongs to the group, not repeated against every name.
       ================================================================== */
    function renderPresence() {
        var now = nowRef();

        var online = roster.members.filter(function (member) { return member.status === 'active'; });

        // Only the shift that comes on next. Anything past that is a question
        // about tomorrow, which the roster below already answers in full.
        // Whoever is already on is excluded — their nextStart is tomorrow's
        // occurrence, so they'd otherwise appear in both halves.
        // Keyed on shift AND start instant: two people on the same shift can be
        // due at different times when one of them has a day off in between.
        var upcoming = roster.members.filter(function (member) {
            return member.status !== 'active' && member.nextStart;
        });
        var nextGroups = groupBy(upcoming, function (member) {
            return member.shiftId + '@' + member.nextStart.valueOf();
        }).slice(0, 1);

        var onlineShown = renderPresenceGroups(
            $('#noc-online-body'),
            sortGroupsByShiftOrder(groupBy(online, function (member) { return member.shiftId; })),
            function (group, $head) {
                var shiftInstants = group.members[0].shift;

                // How much of the shift is left, against the shift's own length.
                appendGauge($head, {
                    remaining: shiftInstants.end.valueOf() - now.valueOf(),
                    span: shiftInstants.end.valueOf() - shiftInstants.start.valueOf(),
                    color: shiftColorOf(group),
                    label: formatDuration(shiftInstants.end.valueOf() - now.valueOf()) + ' left',
                });

                // Selected zone only. This is the glance layer; the shift's
                // team-base hours are stated on the lane bar caption below.
                $('<span class="noc-presence-when">')
                    .text('until ' + formatWhenInZone(shiftInstants.end, selectedTimezone))
                    .appendTo($head);
            },
            'Nobody is on shift right now.',
            STATUS_META.active.cls
        );

        var nextTotal = nextGroups.length ? nextGroups[0].members.length : 0;
        var nextShown = renderPresenceGroups(
            $('#noc-soon-body'),
            nextGroups,
            function (group, $head) {
                var start = group.members[0].nextStart;

                // How much of the wait is left, against the longest gap the
                // rotation ever puts between two shift starts.
                appendGauge($head, {
                    remaining: start.valueOf() - now.valueOf(),
                    span: getLongestGapBetweenShiftStarts(),
                    color: shiftColorOf(group),
                    label: 'in ' + formatDuration(start.valueOf() - now.valueOf()),
                });

                $('<span class="noc-presence-when">')
                    .text('starts ' + formatWhenInZone(start, selectedTimezone))
                    .appendTo($head);
            },
            'Nobody is scheduled to come online.'
        );

        $('#noc-online-count').text(peopleLabel(onlineShown, online.length));
        $('#noc-soon-count').text(peopleLabel(nextShown, nextTotal));
    }

    // While a search is running the denominator stays visible, so "1 of 8"
    // still tells you the person is one of eight rather than the only one.
    function peopleLabel(shown, total) {
        if (!total) { return ''; }
        var noun = total === 1 ? ' person' : ' people';
        return (searchQuery ? shown + ' of ' + total : String(total)) + noun;
    }

    function noMatchText() {
        return 'No match for \u201c' + searchQuery + '\u201d';
    }

    // A fill that never quite vanishes while there is still time on the clock.
    // Without it the last few minutes render as a sub-pixel sliver, so "nearly
    // done" and "done" look identical.
    var GAUGE_MIN_FILL_PCT = 5;

    /* The hourglass. Both halves use it and both DRAIN, because both are
       measuring the same thing: how long until the next change. A short bar
       always means "something is about to happen", whether that's a shift
       ending or a shift starting.

       The denominators differ, and have to:
         online  → the shift's own length. Exact.
         up next → the longest gap the rotation puts between two consecutive
                   shift starts, which getLongestGapBetweenShiftStarts() derives
                   from the shifts actually in use (9h today). A wait longer
                   than that — a weekend, a holiday — pins the bar full, and the
                   text beside it carries the real figure. */
    function appendGauge($head, options) {
        var remaining = Math.max(0, options.remaining);
        if (options.span <= 0) { return; }

        var pct = Math.min(100, remaining / options.span * 100);
        if (remaining > 0) { pct = Math.max(pct, GAUGE_MIN_FILL_PCT); }

        $('<span class="noc-gauge">')
            .toggleClass('noc-gauge--inline', !options.label)
            .attr('data-tip', formatDuration(remaining) + ' of ' + formatDuration(options.span))
            .append($('<span class="noc-gauge-fill">')
                .css({ width: pct + '%', background: options.color }))
            .appendTo($head);

        // Optional: the presence panel needs the figure spelled out beside the
        // bar, but in a roster row the relative line is already that label.
        if (options.label) {
            $('<span class="noc-gauge-eta">').text(options.label).appendTo($head);
        }
    }

    function shiftColorOf(group) {
        var shift = getShift(group.members[0].shiftId);
        return shift ? shift.color : 'var(--nb-muted-dark)';
    }

    // Returns how many people were actually drawn, so the panel heading can
    // report "1 of 8" while a search is narrowing things down.
    function renderPresenceGroups($container, groups, decorate, emptyText, avatarClass) {
        $container.empty();
        var shown = 0;

        groups.forEach(function (group) {
            // A group with no match disappears whole, header included —
            // otherwise the shift name and its countdown would sit above
            // nothing.
            var matching = group.members.filter(matchesSearch);
            if (!matching.length) { return; }
            shown += matching.length;

            var shift = getShift(group.members[0].shiftId);
            var $group = $('<div class="noc-presence-group">').appendTo($container);

            var $head = $('<div class="noc-presence-group-head">').appendTo($group);
            $('<span class="noc-presence-dot">').css('background', shift ? shift.color : 'var(--nb-muted-dark)').appendTo($head);
            $('<span class="noc-presence-shift">').text(shift ? shift.label : 'Not scheduled').appendTo($head);
            decorate(group, $head);

            // Team order, so members of a team sit together. The run breaks are
            // marked so a little air can separate one team from the next
            // without a second layer of headings.
            var $people = $('<div class="noc-presence-people">').appendTo($group);
            var previousTeam = null;

            matching.slice().sort(compareByTeam).forEach(function (member, index) {
                var team = getPrimaryTeam(member.teams);
                renderPersonChip(member, avatarClass)
                    .toggleClass('is-team-start', index > 0 && team !== previousTeam)
                    .appendTo($people);
                previousTeam = team;
            });
        });

        if (!shown) {
            // Distinguishes "nobody is on" from "nobody here matches what you
            // typed" — the second is a statement about the filter, not the world.
            $('<div class="noc-presence-empty">')
                .text(searchQuery ? noMatchText() : emptyText)
                .appendTo($container);
        }

        return shown;
    }

    // Same avatar and name language as a roster row, one density down. The ring
    // carries status exactly as it does there — green and breathing for someone
    // on shift, neutral for someone not on yet — so "green means live" holds
    // everywhere on the page rather than only in the table.
    function renderPersonChip(member, statusClass) {
        var $chip = $('<div class="noc-person">');
        $('<div class="noc-avatar">').addClass(statusClass).text(initials(member.name)).appendTo($chip);

        var $id = $('<div class="noc-person-id">').appendTo($chip);
        $('<div class="noc-person-name">').text(member.name).appendTo($id);

        var primary = getPrimaryTeam(member.teams);
        $('<div class="noc-person-team">')
            .css('color', primary ? teamColors(primary).fg : '')
            .text(member.teams.join(' · ') || '—')
            .appendTo($id);
        return $chip;
    }

    // Preserves first-seen group order, which keeps the roster's own sort
    // (soonest first) intact.
    function groupBy(items, keyOf) {
        var groups = [];
        var index = {};

        items.forEach(function (item) {
            var key = keyOf(item);
            if (!index[key]) {
                index[key] = { key: key, members: [] };
                groups.push(index[key]);
            }
            index[key].members.push(item);
        });

        return groups;
    }

    // Reorders shift groups to match the legend's clock order instead of
    // whichever member happened to sort first within the group. Only for
    // panels where every group is shown — "Up next" keeps its own soonest-first
    // order because it deliberately keeps just the one group that is next.
    function sortGroupsByShiftOrder(groups) {
        var order = {};
        getShifts().forEach(function (shift, index) { order[shift.id] = index; });

        return groups.slice().sort(function (a, b) {
            var aOrder = order[a.members[0].shiftId];
            var bOrder = order[b.members[0].shiftId];
            return aOrder - bOrder;
        });
    }

    /* ==================================================================
       Roster rendering : shift lanes + member rows + the 7-day strip
       ================================================================== */
    function renderRosterBoard() {
        var now = nowRef();
        var weekDays = buildWeekWindow();
        var $tbody = $('#noc-tbody').empty();

        // These are team-base calendar days — a shift belongs to an IST date —
        // so the range says which zone it is counting in. The page date header
        // above is the viewer's date, and the two legitimately differ.
        $('#noc-roster-week-head').text(
            weekDays[0].date.format('MMM D') + ' – ' + weekDays[weekDays.length - 1].date.format('MMM D')
            + ' ' + nowRef().tz(getScheduleTimezone()).format('z')
        );

        var byShift = {};
        roster.members.forEach(function (member) {
            var laneId = member.shiftId || UNSCHEDULED_LANE;
            (byShift[laneId] = byShift[laneId] || []).push(member);
        });

        // getRoster() returns members already sorted active-first, and grouping
        // preserves that order inside each lane.
        getShifts().forEach(function (shift) {
            if (byShift[shift.id]) { renderLane(shift, byShift[shift.id], weekDays, now, $tbody); }
        });
        if (byShift[UNSCHEDULED_LANE]) {
            renderLane(null, byShift[UNSCHEDULED_LANE], weekDays, now, $tbody);
        }

        // Hiding rows can empty the board completely; this is what stands in.
        $('<tr class="noc-roster-empty is-filtered-out">')
            .append($('<td colspan="5">'))
            .appendTo($tbody);
    }

    // One lane header + its members. `shift` is null for the catch-all lane
    // holding anyone with no assignment covering today.
    function renderLane(shift, members, weekDays, now, $tbody) {
        var laneId = shift ? shift.id : UNSCHEDULED_LANE;
        var liveCount = members.filter(function (m) { return m.status === 'active'; }).length;

        var $inner = $('<div class="noc-lane-inner">');
        if (shift) { $inner.css('--lane-color', shift.color); }

        // Left column — the counterpart to a timezone name in the chart above.
        var $label = $('<div class="noc-lane-label">').appendTo($inner);
        $('<div class="noc-lane-name">').text(shift ? shift.label : 'Not scheduled').appendTo($label);

        $('<div class="noc-lane-count">').appendTo($label);   // filled by renderLaneCount()

        // Right column — the timeline, starting where the chart's does.
        var $main = $('<div class="noc-lane-main">').appendTo($inner);
        if (shift) { renderLaneBar(shift).appendTo($main); }

        $('<tr class="noc-lane">')
            .toggleClass('is-live', liveCount > 0)
            .attr('data-lane-header', laneId)
            .attr('data-lane-total', members.length)
            .attr('data-lane-live', liveCount)
            .append($('<td colspan="5">').append($inner))
            .appendTo($tbody);

        // Working now first, then team — the same reading as the presence chips
        // above, so the two halves of the page agree on how a list is ordered.
        members.slice().sort(compareByStatusThenTeam).forEach(function (member) {
            $tbody.append(renderMemberRow(member, laneId, weekDays, now));
        });
    }

    // The shift drawn against the SELECTED timezone's clock. The chart up top
    // only draws shift blocks on the India row, so this is the one place that
    // shows where the shift lands in the reader's own day — including whether
    // it crosses their midnight.
    function renderLaneBar(shift) {
        var $wrap = $('<div class="noc-lane-bar">');
        var $bar = $('<div class="noc-bar-cell">').appendTo($wrap);

        // The times ride on the block itself — a wide band of colour that was
        // otherwise carrying a label the lane already states two inches left.
        // 18% keeps the caption off blocks too narrow to hold it, which at the
        // board's min-width is about the point where it stops fitting.
        // Both zones when the block can hold them, the reader's own clock alone
        // when it can't — that one matches the hour ruler directly beneath.
        var canonical = canonicalShiftInstants(shift);
        var ownClock = formatRangeWithZone(canonical, selectedTimezone);

        // Only offer the two-zone caption when there are two zones to show —
        // reading IST would otherwise print the identical range twice.
        var captions = selectedTimezone === getScheduleTimezone()
            ? [ownClock]
            : [formatRangeWithZone(canonical, getScheduleTimezone()) + '  ·  ' + ownClock, ownClock];

        var $shiftRow = $('<div class="noc-bar-row noc-bar-row--shift">').appendTo($bar);
        renderShiftBlocksInto($shiftRow, shift, captions);

        var $labelsRow = $('<div class="noc-bar-row noc-bar-row--labels">')
            .css('background', buildClockGradientCss(selectedTimezone))
            .appendTo($bar);
        renderHourMarksInto($labelsRow, buildHourMarks(selectedTimezone));

        // Appended to the wrapper, not the bar cell: the cell clips its overflow
        // (which is what keeps shift blocks inside the window) and would slice
        // the orb off the top of the line.
        $('<div class="noc-now-line noc-now-line--lane">').appendTo($wrap);
        $('<div class="noc-ref-line">').appendTo($wrap);
        return $wrap;
    }

    // Clones before converting: moment's .tz(zone) is a mutator, so formatting a
    // shift's instants in a second zone used to rewrite the object in place. It
    // happened to read correctly because callers pass a freshly built object, but
    // any reuse would have silently shown the wrong zone.
    function formatRange(instants, tz) {
        return instants.start.clone().tz(tz).format('h:mm a')
            + ' – ' + instants.end.clone().tz(tz).format('h:mm a');
    }

    /* ---------------- one <tr> per member : who / last / next / 7-day strip ---------------- */
    function renderMemberRow(member, laneId, weekDays, now) {
        var statusMeta = STATUS_META[member.status];

        var $tr = $('<tr class="noc-row">')
            .attr('data-row', member.id)
            .attr('data-search', searchKeyFor(member))
            .attr('data-status', member.status)
            .attr('data-lane', laneId);

        // --- who ---
        var $tdMember = $('<td class="noc-td-member">');
        var $top = $('<div class="noc-member-top">');
        $('<div class="noc-avatar">').addClass(statusMeta.cls).text(initials(member.name)).appendTo($top);
        var $idBlock = $('<div class="noc-member-id">');
        $('<div class="noc-member-name">').text(member.name).appendTo($idBlock);
        $('<div class="noc-status">').addClass(statusMeta.cls).append(
            $('<span class="noc-status-dot">'),
            $('<span>').text(statusMeta.label)
        ).appendTo($idBlock);
        $tdMember.append($top.append($idBlock));

        // --- team ---
        var $tdTeam = $('<td class="noc-td-team">').append(renderTeams(member.teams));

        // --- last shift ---
        var $tdLast = $('<td class="noc-td-when">').append(
            member.lastShift ? whenCell(member.lastShift.end, now, 'ended') : noneCell()
        );

        // --- next up : someone mid-shift cares when it ends, not when tomorrow's
        //     one starts, so the column swaps to that for them. ---
        var $tdNext = $('<td class="noc-td-when">').append(
            member.status === 'active'
                ? whenCell(member.shift.end, now, 'ends', { gauge: {
                    remaining: member.shift.end.valueOf() - now.valueOf(),
                    span: member.shift.end.valueOf() - member.shift.start.valueOf(),
                    color: getShift(member.shiftId).color,
                } })
                : (member.nextStart
                    ? whenCell(member.nextStart, now, 'starts', { proximity: true })
                    : noneCell())
        );

        // --- 7-day strip ---
        var $tdWeek = $('<td class="noc-td-week">').append(renderWeekStrip(member, weekDays));

        return $tr.append($tdMember, $tdTeam, $tdLast, $tdNext, $tdWeek);
    }

    /* Team colours. Deliberately low-saturation: the board already spends its
       strong colour on shift blocks and its semantic colour on status, so team
       is a third axis that has to be legible without competing with either.
       Assigned by position in the team list, so adding a team to teamOrder — or
       simply putting one on a member — gives it a colour with nothing to
       register. Wraps if there are ever more teams than entries. */
    var TEAM_PALETTE = [
        { fg: '#2f5d8a', bg: '#e6eef6' },
        { fg: '#1f6e76', bg: '#dff0f1' },
        { fg: '#8a5a2f', bg: '#f7ece1' },
        { fg: '#6b4c6e', bg: '#f1e7f3' },
        { fg: '#4a6b45', bg: '#e8f0e6' },
        { fg: '#7d4a4a', bg: '#f7e8e8' },
    ];
    var TEAM_NEUTRAL = { fg: 'var(--nb-text-muted)', bg: 'var(--nb-muted-light)' };

    function teamColors(team) {
        var index = getAllTeams().indexOf(team);
        return index === -1 ? TEAM_NEUTRAL : TEAM_PALETTE[index % TEAM_PALETTE.length];
    }

    function renderTeams(teams) {
        if (!teams || !teams.length) { return $('<div class="noc-team-none">').text('—'); }

        var $wrap = $('<div class="noc-teams">');
        teams.forEach(function (team) {
            var colors = teamColors(team);
            $('<span class="noc-team-pill">')
                .css({ background: colors.bg, color: colors.fg })
                .text(team)
                .appendTo($wrap);
        });
        return $wrap;
    }

    /* options: { proximity, gauge }
       `proximity` tints the relative line by how soon it is, so the column can
       be scanned for "who is back soon" instead of read row by row.
       `gauge` is passed for someone mid-shift: the bar states how far through
       they are, which is the one case here with an honest denominator. The two
       are mutually exclusive by design — a coloured bar and coloured text on one
       line would be two encodings competing for the same glance. */
    function whenCell(instant, now, verb, options) {
        var settings = options || {};
        var delta = instant.valueOf() - now.valueOf();
        var relative = delta >= 0
            ? verb + ' in ' + formatDuration(delta)
            : verb + ' ' + formatDuration(delta) + ' ago';

        // Always named: "Today, 3:30 am" reads as the viewer's clock and is the
        // viewer's clock, but nothing said so until now.
        var $cell = $('<div>').append(
            $('<div class="noc-when-abs">')
                .text(formatWhen(instant) + ' ' + instant.clone().tz(selectedTimezone).format('z'))
        );

        var $relative = $('<div class="noc-when-rel">')
            .addClass(settings.proximity ? proximityClass(delta) : '')
            .text(relative)
            .appendTo($cell);

        if (settings.gauge) {
            // Inline rather than on a line of its own: the row's height is set
            // by the 7-day strip, and staying on this line cannot change it.
            appendGauge($relative, settings.gauge);
        }

        return $cell;
    }

    // Absolute distance, not a fraction — proximity needs no denominator, which
    // is why it works on a column where a gauge cannot.
    var PROXIMITY_SOON_MS = 60 * 60 * 1000;
    var PROXIMITY_NEAR_MS = 6 * 60 * 60 * 1000;

    function proximityClass(delta) {
        if (delta < 0) { return ''; }
        if (delta <= PROXIMITY_SOON_MS) { return 'is-soon'; }
        if (delta <= PROXIMITY_NEAR_MS) { return 'is-near'; }
        return 'is-distant';
    }

    function noneCell() {
        return $('<div class="noc-when-none">').text('—');
    }

    function buildWeekWindow() {
        var today = nowRef().tz(getScheduleTimezone()).startOf('day');
        var days = [];
        for (var offset = -WEEK_WINDOW_BEFORE; offset <= WEEK_WINDOW_AFTER; offset++) {
            var date = today.clone().add(offset, 'days');
            days.push({ date: date, dateStr: date.format('YYYY-MM-DD'), isToday: offset === 0 });
        }
        return days;
    }

    // getDayState() hands back raw facts — { key, shiftId, holidayName } — and
    // the wording of the cell tooltip is decided here.
    function describeDayState(state) {
        if (state.key === 'holiday') { return state.holidayName; }
        if (state.key === 'leave') { return 'On leave'; }
        if (state.key === 'off') { return 'Weekly off'; }
        if (state.key === 'not-scheduled') { return 'Not scheduled'; }

        var shift = getShift(state.shiftId);
        return shift.label + ' · ' + formatShiftHours(shift.id) + ' IST';
    }

    function renderWeekStrip(member, weekDays) {
        var $week = $('<div class="noc-week">');
        var $cells = $('<div class="noc-week-cells">').appendTo($week);

        weekDays.forEach(function (day) {
            var state = getDayState(member.id, day.dateStr);
            var $cell = $('<div class="noc-week-day">')
                .addClass('is-' + state.key)
                .toggleClass('is-today', day.isToday)
                .attr('data-tip', day.date.format('ddd, MMM D') + ' — ' + describeDayState(state))
                .text(day.date.format('ddd'));
            if (state.shiftId) { $cell.css('--wd-color', getShift(state.shiftId).color); }
            $cell.appendTo($cells);
        });

        var $marks = $('<div class="noc-week-marks">').appendTo($week);
        addWeekMark($marks, weekDays, member.lastShift ? member.lastShift.dateStr : null, 'Last');
        addWeekMark($marks, weekDays, member.nextStart
            ? member.nextStart.clone().tz(getScheduleTimezone()).format('YYYY-MM-DD')
            : null, 'Next');
        return $week;
    }

    // Falls outside the seven-day window? Then no marker — the text columns
    // still carry the exact answer.
    function addWeekMark($marks, weekDays, dateStr, label) {
        if (!dateStr) { return; }
        var column = -1;
        weekDays.forEach(function (day, index) {
            if (day.dateStr === dateStr) { column = index; }
        });
        if (column === -1) { return; }

        $('<span class="noc-week-mark">')
            .css('grid-column', String(column + 1))
            .text('▴ ' + label)
            .appendTo($marks);
    }

    /* Two markers, and they mean different things.

       The dark line with the orb is ALWAYS actual current time — that never
       changes meaning, wherever it appears. When the board is shifted to another
       day, real now falls outside the window and the line simply isn't drawn.

       The dashed accent line is the instant being VIEWED, and only exists while
       shifted. Dashed because it is a marker rather than a live position, accent
       because that is already the page's colour for "a time you chose" — the
       crosshair uses it too. The per-row time chips follow whichever line the
       board is actually answering for. */
    function tickLiveClocks() {
        if (!windowStart) { return; }

        var reference = nowRef();

        // The window is one calendar day and is only rebuilt by the 60s
        // re-renders. Without this, midnight leaves the reference past windowEnd
        // where pctInWindow() clamps to 100 — so the line pins to the far right
        // for up to a minute before snapping back. Everything else in the strips
        // is identical day to day, so re-anchoring here is enough. Checked
        // against the reference, not real now, or a shifted board would reset
        // the window every single tick.
        if (reference.isBefore(windowStart) || !reference.isBefore(windowEnd)) { resetWindow(); }

        // Real now: positioned always, hidden when it falls outside the window.
        var actual = moment();
        var actualInWindow = !actual.isBefore(windowStart) && actual.isBefore(windowEnd);
        $('.noc-now-line')
            .css('left', pctInWindow(actual) + '%')
            .toggleClass('is-out-of-window', !actualInWindow)
            .toggleClass('is-secondary', isTimeShifted());

        var pct = pctInWindow(reference);
        $('.noc-ref-line').css('left', pct + '%').toggleClass('is-on', isTimeShifted());

        // Each timezone row states its own local time, right at the line.
        var $chips = $('.noc-now-chip').toggleClass('is-reference', isTimeShifted());
        $chips.each(function () {
            var $chip = $(this);
            var local = reference.clone().tz($chip.attr('data-tz'));
            $chip.find('.noc-now-chip-time').text(local.format('h:mm a'));
            // 'z' gives the live abbreviation, so it follows DST on its own —
            // MST/MDT, EST/EDT, IST/IDT — rather than being pinned in the data.
            $chip.find('.noc-now-chip-zone').text(local.format('z'));
        });

        // Measured after the text is in, so the threshold tracks the real width
        // rather than an estimate that goes stale when the format changes.
        var chipWidth = $chips.first().outerWidth() || 0;
        var stripWidth = $('#noc-tzcmp-tbody .noc-bar-row--labels').first().width() || 0;
        $chips.css('left', pct + '%').toggleClass('is-flipped', shouldFlipChip(pct, chipWidth, stripWidth));
    }

    /* ==================================================================
       Crosshair : hover anywhere on a timeline to read that instant in the
       selected zone, with the team-base conversion underneath. Bound by
       delegation, so it survives the 60-second re-renders without needing to be
       re-attached, and throttled to one update per frame.
       ================================================================== */
    var CROSSHAIR_TRACKS = '#noc-tzcmp-now-overlay, .noc-lane-bar';
    var crosshairFrame = null;

    function initCrosshair() {
        $(document)
            .on('mousemove', CROSSHAIR_TRACKS, function (event) {
                var track = this;
                var x = event.clientX;
                var y = event.clientY;
                if (crosshairFrame) { return; }
                crosshairFrame = requestAnimationFrame(function () {
                    crosshairFrame = null;
                    moveCrosshair(track, x, y);
                });
            })
            .on('mouseleave', CROSSHAIR_TRACKS, function () {
                $(this).removeClass('is-crosshair-on');
            });
    }

    function moveCrosshair(track, clientX, clientY) {
        if (!windowStart) { return; }

        var $track = $(track).addClass('is-crosshair-on');
        var $line = $track.children('.noc-hover-line');
        if (!$line.length) { $line = buildCrosshair($track); }
        var $chip = $track.children('.noc-hover-chip');

        var rect = track.getBoundingClientRect();
        if (!rect.width) { return; }

        var pct = Math.max(0, Math.min(100, (clientX - rect.left) / rect.width * 100));
        var at = moment(windowStart.valueOf() + (windowEnd.valueOf() - windowStart.valueOf()) * pct / 100);

        $chip.find('.noc-hover-row--base').text(formatWhenInZone(at, getScheduleTimezone()));
        $chip.find('.noc-hover-row--selected').text(formatWhenInZone(at, selectedTimezone));

        // Follows the pointer's row so the reading lands where the eye already
        // is, clamped so it can't hang off the top or bottom of the track.
        var chipHeight = $chip.outerHeight();
        var top = Math.max(chipHeight / 2, Math.min(rect.height - chipHeight / 2, clientY - rect.top));

        $line.css('left', pct + '%');
        $chip.css({ left: pct + '%', top: top + 'px' })
            .toggleClass('is-flipped', shouldFlipChip(pct, $chip.outerWidth(), rect.width));
    }

    // Selected zone on top, team base underneath: the pointer is being moved in
    // the reader's own clock, so that's the reading they're steering by — the
    // conversion is what they came to look up.
    function buildCrosshair($track) {
        var $line = $('<div class="noc-hover-line">');
        $track.append(
            $line,
            $('<div class="noc-hover-chip">').append(
                $('<span class="noc-hover-row noc-hover-row--selected">'),
                $('<span class="noc-hover-row noc-hover-row--base">')
            )
        );
        return $line;
    }

    var NOW_CHIP_GAP = 10;    // keep in step with the offsets on .noc-now-chip
    var NOW_CHIP_EDGE = 28;   // clearance kept between the chip and the strip edge

    // The bar cell clips its overflow, so a chip that doesn't fit is a chip that
    // gets cut in half. Move to the left of the line well before that point —
    // but only if the left side has the room, otherwise the line just after
    // midnight IST would flip itself straight off the other edge.
    //
    // The line sweeps right all day and then jumps back to the far left at
    // midnight; both ends of that cycle land squarely inside one branch (at the
    // far left the right side has room to spare, at the far right the left side
    // does), so the reset can't leave the chip oscillating at a boundary.
    function shouldFlipChip(pct, chipWidth, stripWidth) {
        if (!stripWidth || !chipWidth) { return false; }

        var linePx = pct / 100 * stripWidth;
        var needed = chipWidth + NOW_CHIP_GAP + NOW_CHIP_EDGE;
        return (stripWidth - linePx) < needed && linePx >= needed;
    }
</script>
